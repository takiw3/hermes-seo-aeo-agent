name: Validate distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install repository-only dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Standard library unittest suite
        run: python -m unittest discover -s tests -v
      - name: Repository contract validation
        run: python scripts/validate.py

# Actual Hermes install/update tests intentionally require a separately installed
# Hermes CLI. Run scripts/test_install.py locally in its disposable environment.
# This offline job does not claim a Hermes runtime matrix or model evaluations.
